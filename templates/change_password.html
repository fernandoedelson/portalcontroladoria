{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Alterar senha</h1>
  <div class="sub">{% if current_user.must_change_password %}Defina uma nova senha para continuar.{% else %}Atualize sua senha de acesso.{% endif %}</div></div></div>
<div class="card" style="max-width:460px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div class="form-row"><label class="field-label">Senha atual</label>
      <input class="input" type="password" name="current" required/></div>
    <div class="form-row"><label class="field-label">Nova senha</label>
      <input class="input" type="password" name="new" required/>
      <div class="help-txt">Mínimo de 8 caracteres.</div></div>
    <div class="form-row"><label class="field-label">Confirmar nova senha</label>
      <input class="input" type="password" name="confirm" required/></div>
    <button class="btn btn-primary" type="submit">Salvar</button>
  </form>
</div>
{% endblock %}
