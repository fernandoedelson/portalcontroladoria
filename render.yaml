# Blueprint de deploy na Render (plano Starter + disco persistente).
# Cria um Web Service Python servido por waitress, com o SQLite e os uploads
# gravados num disco que sobrevive a deploys/reinicios.
services:
  - type: web
    name: portalcontroladoria          # vira portalcontroladoria.onrender.com
    runtime: python
    plan: starter                      # ~US$7/mês (o mesmo tipo do serviço atual)
    region: oregon                     # ajuste para a mesma região do serviço antigo
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: HOST
        value: "0.0.0.0"
      - key: TZ                       # horario de Brasilia (o app tambem forca no codigo)
        value: America/Sao_Paulo
      - key: PORTAL_DATA_DIR          # instance/ + uploads/ + data/ vão para o disco
        value: /var/data
      - key: SECRET_KEY               # gerado uma vez pela Render (não fica no repo)
        generateValue: true
      - key: TEAM_PORTAL_URL          # link que vai nos e-mails/WhatsApp
        value: https://portalcontroladoria.onrender.com
      # Segredos de e-mail/WhatsApp: cadastrar na aba Environment (NÃO no repo):
      #   SMTP_USER, SMTP_PASSWORD (senha de app do Gmail), SMTP_FROM (opcional)
      #   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
